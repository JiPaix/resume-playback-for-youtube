<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; margin: 1em; min-width: 22em; }
    label { display: flex; gap: .6em; align-items: center; }
    p { color: GrayText; margin: .6em 0 0; }
  </style>
</head>
<body>
  <label for="retention">Forget a video's position after
    <select id="retention">
      <option value="7">7 days</option>
      <option value="15">15 days</option>
      <option value="30">30 days</option>
      <option value="60">60 days</option>
      <option value="90">90 days</option>
    </select>
    without watching it
  </label>
  <p>Positions are only stored in this browser. Finished videos are forgotten right away.</p>
  <script src="cleanup.js"></script>
  <script src="options.js"></script>
</body>
</html>

name: release

# Push a tag like v1.0.1 (matching "version" in manifest.json) to publish that
# version on addons.mozilla.org (listed) and create a GitHub release.
# Secrets: AMO_JWT_ISSUER and AMO_JWT_SECRET, from
# https://addons.mozilla.org/developers/addon/api/key/

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  amo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(node -p 'require("./manifest.json").version')
          [ "$version" = "$manifest" ] \
            || { echo "::error::tag $GITHUB_REF_NAME does not match manifest.json version $manifest"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the package
        run: |
          ./build.sh
          mkdir -p dist/src
          unzip -q "dist/resume-playback-for-youtube-$VERSION.zip" -d dist/src

      - name: Lint
        run: npx --yes web-ext@10 lint --source-dir dist/src --warnings-as-errors

      - name: Submit to addons.mozilla.org (listed)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          # --amo-metadata creates the listing on the first submission (summary,
          # description, category, license); later versions reuse it.
          # --approval-timeout 0: submit and exit, don't wait for review.
          npx --yes web-ext@10 sign --source-dir dist/src --artifacts-dir dist/signed \
            --channel listed --amo-metadata docs/amo-metadata.json --approval-timeout 0

      - name: Screenshots (uploads only the missing ones)
        continue-on-error: true
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node tools/amo-previews.mjs

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" "dist/resume-playback-for-youtube-$VERSION.zip" \
                 --title "Resume Playback for YouTube $VERSION" --generate-notes
